<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kept: capture evaluation</title>
    <style>
      body { font: 14px/1.45 system-ui, sans-serif; max-width: 1100px; margin: 24px auto; padding: 0 16px; color: #1c1c1c; }
      h1 { font-size: 20px; }
      button { font: inherit; padding: 5px 12px; }
      table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 12px; }
      th, td { border-bottom: 1px solid #ddd; padding: 5px 6px; text-align: left; vertical-align: top; }
      .muted { color: #666; } .pass { color: #0a7a2f; } .unsafe { color: #b00020; } .safe { color: #8a5a00; }
      pre { background: #f6f6f6; padding: 10px; overflow-x: auto; }
      textarea { width: 100%; height: 80px; font: 12px monospace; }
    </style>
  </head>
  <body>
    <h1>Kept: capture evaluation</h1>
    <p class="muted">Development tool. Each note is read through the same path as the review screen, by the cloud model, into its own store (<code>opfs://kept-eval</code>) holding a fixed workspace. See docs/evaluation.md.</p>
    <p id="appcheck" class="muted"></p>
    <p><button id="run">Run all notes</button> <span id="progress"></span></p>
    <pre id="summary"></pre>
    <div id="rows"></div>
    <p>Raw report: <button id="copy">Copy</button></p>
    <textarea id="report" readonly></textarea>
    <script type="module" src="/src/eval-page.js"></script>
  </body>
</html>
